name: HRSDGDG CI/CD Automated Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image (Dry Run & Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hrsdgdg-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to Remote Production Server via SSH
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '198.199.75.86' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "💎 [HRSDGDG CI/CD] Starting automated deployment on server..."
            cd /var/www/hrsdgdg
            
            # Fetch and sync latest code from GitHub repository
            if [ -d ".git" ]; then
              git remote set-url origin https://github.com/othmanbakkali/hrsdgdg.git 2>/dev/null || true
              git fetch origin main || git fetch https://github.com/othmanbakkali/hrsdgdg.git main
              git reset --hard FETCH_HEAD
            elif [ -d "/var/repo/hrsdgdg.git" ]; then
              git --git-dir=/var/repo/hrsdgdg.git --work-tree=/var/www/hrsdgdg fetch https://github.com/othmanbakkali/hrsdgdg.git main:main || true
              git --git-dir=/var/repo/hrsdgdg.git --work-tree=/var/www/hrsdgdg checkout -f main
            fi
            
            # Execute automated docker deployment
            chmod +x deploy-docker.sh
            ./deploy-docker.sh
